name: Hazelchat
slug: hazelchat
type: plugin
version: 1.0.1
description: Adds your Hazelchat AI chat agent to every page. It answers visitors from the pages you approved, shows its sources and passes on their enquiries.
icon: comments
author:
  name: Hazelchat
  email: hello@hazelchat.co
  url: https://hazelchat.co
homepage: https://github.com/hazelchat-co/grav-plugin-hazelchat
docs: https://hazelchat.co/integrations/grav/
keywords: chat, ai, chatbot, agent, customer service, enquiries, faq
bugs: https://github.com/hazelchat-co/grav-plugin-hazelchat/issues
license: MIT
compatibility:
  grav: ['1.7', '2.0']
dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    code:
      type: textarea
      label: PLUGIN_HAZELCHAT.CODE
      help: PLUGIN_HAZELCHAT.CODE_HELP
      description: PLUGIN_HAZELCHAT.CODE_DESCRIPTION
      rows: 3
      # The pasted code is a <script> line; only its key is ever printed.
      xss_check: false
      validate:
        max: 1000
    consent:
      type: toggle
      label: PLUGIN_HAZELCHAT.CONSENT_LABEL
      help: PLUGIN_HAZELCHAT.CONSENT_HELP
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
